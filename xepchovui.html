<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sơ Đồ Hộp Mù Lớp Học - GVCN</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --info: #0ea5e9; --info-dark: #0284c7; --border-color: #e2e8f0; 
            --primary-orange: #f97316; --dark-orange: #ea580c; --light-orange: #fff7ed;
            --bg-body: #f8fafc; --text-main: #1e293b; --success: #10b981;
            --purple: #8b5cf6;
        }
        
        body { 
            font-family: 'Inter', sans-serif; background-color: var(--bg-body); 
            padding: 20px; color: var(--text-main); margin: 0;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px); 
            background-size: 30px 30px;
        }
        
        .main-container { display: flex; gap: 20px; max-width: 1450px; margin: 0 auto; align-items: flex-start; transition: all 0.3s ease; }

        .sidebar { 
            flex: 0 0 280px; background: white; border: 2px solid var(--border-color); 
            border-radius: 16px; padding: 20px; position: sticky; top: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.03); transition: all 0.3s ease; overflow: hidden;
        }
        .sidebar.collapsed { flex: 0 0 50px; padding: 15px 10px; background: #fff7ed; border-color: #fdba74; cursor: pointer; }
        .sidebar.collapsed * { display: none; } 
        .sidebar.collapsed::after {
            content: '📋 Bật Lại Danh Sách Lớp'; display: block; writing-mode: vertical-rl;
            text-orientation: mixed; color: var(--dark-orange); font-weight: 800;
            font-size: 13px; text-align: center; height: 180px; margin: auto;
        }

        .sidebar h3 { margin-top: 0; color: var(--info); font-weight: 900; text-transform: uppercase; font-size: 16px; border-bottom: 2px dashed #e2e8f0; padding-bottom: 10px;}
        .student-list { list-style: none; padding: 0; margin: 0; max-height: 500px; overflow-y: auto; }
        .student-list li { padding: 10px 5px; border-bottom: 1px solid #f1f5f9; font-size: 13.5px; display: flex; justify-content: space-between; font-weight: 700; color: #334155;}
        
        .content { flex: 1; transition: all 0.3s ease; }
        .classroom-layout { background: white; border: 2px solid var(--border-color); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);}
        .desks-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; row-gap: 30px; }
        .desk-item { background: #f8fafc; border: 2px solid #bae6fd; border-radius: 14px; padding: 22px 10px 12px 10px; text-align: center; position: relative; display: flex; gap: 8px; }
        .desk-label { font-size: 12px; font-weight: 900; color: white; background: var(--info); position: absolute; top: -12px; left: 50%; transform: translateX(-50%); padding: 3px 20px; border-radius: 20px; box-shadow: 0 2px 4px rgba(14,165,233,0.3);}
        
        .blind-box {
            flex: 1; padding: 10px 2px; border-radius: 10px; background: linear-gradient(135deg, #ffedd5, #fed7aa); 
            color: #c2410c; font-weight: 900; font-size: 14px; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(249, 115, 22, 0.15); border: 2px solid #fdba74;
            transition: all 0.2s; user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative;
        }
        .blind-box:hover { transform: scale(1.05) translateY(-3px); box-shadow: 0 8px 15px rgba(249, 115, 22, 0.3); border-color: var(--primary-orange); }
        .box-icon { font-size: 20px; margin-bottom: 3px; }

        .seat-revealed {
            flex: 1; padding: 8px 2px; border-radius: 10px; font-weight: 800; font-size: 13.5px;
            display: flex; align-items: center; justify-content: center; border: 2px solid;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; text-align: center;
        }
        .seat-nam { background-color: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
        .seat-nu { background-color: #fdf2f8; color: #be185d; border-color: #fbcfe8; }
        .seat-empty { background: #f1f5f9; border: 2px dashed #cbd5e1; color: #94a3b8; flex: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold;}

        .rolling-text { position: absolute; font-size: 13px; color: #333; font-weight: bold; width: 100%; white-space: nowrap; animation: fastRoll 0.1s linear infinite; }
        @keyframes fastRoll { 0% { transform: translateY(15px); opacity: 0; } 50% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-15px); opacity: 0; } }
        
        .bottom-layout { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; margin-top: 40px; border-top: 2px dashed var(--border-color); padding-top: 30px;}
        .layout-box { border-radius: 12px; text-align: center; font-weight: 900; display: flex; align-items: center; justify-content: center; height: 50px;}
        .box-board { background: #334155; color: white; border: 4px solid #1e293b; font-size: 16px; text-transform: uppercase; box-shadow: 0 10px 20px rgba(0,0,0,0.1);}
        .box-select { background: #fff7ed; border: 2px dashed var(--primary-orange); transition: 0.3s; padding: 5px;}
        .box-select select { width: 100%; height: 100%; border: none; background: transparent; font-family: inherit; font-weight: 900; color: var(--dark-orange); text-align: center; font-size: 15px; outline: none; cursor: pointer; text-align-last: center;}

        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
        .shake { animation: shakeAnim 0.4s ease-in-out; }
        @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-5deg); } 50% { transform: translateX(5px) rotate(5deg); } 75% { transform: translateX(-5px) rotate(-5deg); } }

        .action-bar { margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: space-between; align-items: center;}
        
        .mode-select { padding: 12px 15px; border-radius: 12px; border: 2px solid var(--purple); background: #faf5ff; color: var(--purple); font-weight: 900; font-family: 'Inter', sans-serif; font-size: 14.5px; outline: none; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s;}
        .mode-select:focus { border-color: #d8b4fe; box-shadow: 0 0 0 3px #f3e8ff; }

        .btn-action { padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: 900; color: white; font-size: 14.5px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; display: flex; align-items: center; gap: 8px; font-family: inherit;}
        .btn-action:hover { transform: translateY(-3px); filter: brightness(1.1); }
        
        .btn-back-main { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); text-decoration: none; padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 14.5px; transition: 0.2s; display: flex; align-items: center; gap: 8px;}
        .btn-back-main:hover { background: #e2e8f0; color: var(--primary-orange); border-color: #cbd5e1;}

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar" id="sidebarPanel" onclick="toggleSidebar(event)">
            <h3>📋 Danh Sách Lớp</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; margin-top: 15px;">
                <span style="font-size: 13px; font-weight: bold; color: var(--text-muted);">Đã kết nối dữ liệu:</span>
                <span style="background: var(--success); color: white; padding: 4px 12px; border-radius: 12px; font-weight: 900; font-size: 13px;" id="totalCount">0 HS</span>
            </div>
            <ul class="student-list" id="studentListUI">
                <li style="color: #94a3b8; font-style: italic;">Đang tải danh sách...</li>
            </ul>
        </div>

        <div class="content">
            <div class="action-bar">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <!-- Hệ sinh thái Xếp chỗ -->
                    <select id="mixMode" class="mode-select">
                        <option value="same">👫 Cùng Giới Tính (Mặc định)</option>
                        <option value="mixed">💑 Nam - Nữ Ghép Đôi</option>
                        <option value="numerology">🔮 Thần Số Học (Tương Hợp)</option>
                        <option value="battu">☯️ Tử Vi / Bát Tự (Tam Hợp)</option>
                        <option value="split">⚔️ Chia Phe Nam - Nữ</option>
                        <option value="random">🌪️ Hỗn Loạn 100%</option>
                    </select>

                    <button class="btn-action" style="background: linear-gradient(135deg, var(--primary-orange), var(--dark-orange));" onclick="startBlindBoxGame()">
                        🎁 TẠO HỘP MÙ
                    </button>
                    <button class="btn-action" style="background: linear-gradient(135deg, #ec4899, #be185d);" onclick="revealAllWithSpin()">
                        🎡 Vòng Quay
                    </button>
                    <button class="btn-action" style="background: linear-gradient(135deg, #4f46e5, #3730a3);" onclick="revealAllQuick()">
                        👀 Mở Nhanh
                    </button>
                </div>
                
                <div style="display: flex; gap: 15px;">
                    <button class="btn-action" style="background: linear-gradient(135deg, var(--success), #059669);" onclick="syncLayoutToMain()">
                        💾 LƯU SƠ ĐỒ LỚP
                    </button>
                    <a href="sodolop.html" class="btn-back-main">⬅ Trở Về</a>
                </div>
            </div>

            <div class="classroom-layout">
                <div class="desks-grid" id="deskGrid"></div>

                <div class="bottom-layout">
                    <div class="layout-box box-select">
                        <select id="leftBox" onchange="syncLayoutBoxes('left')">
                            <option value="door">🚪 CỬA RA VÀO</option>
                            <option value="teacher">👨‍🏫 BÀN GIÁO VIÊN</option>
                        </select>
                    </div>
                    <div class="layout-box box-board">BẢNG ĐEN / MÀN HÌNH TƯƠNG TÁC</div>
                    <div class="layout-box box-select">
                        <select id="rightBox" onchange="syncLayoutBoxes('right')">
                            <option value="teacher">👨‍🏫 BÀN GIÁO VIÊN</option>
                            <option value="door">🚪 CỬA RA VÀO</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCbA_3aOK2tOHFpWpJBnOMgcDfTHNf5pro",
            authDomain: "quanlylop-ntb.firebaseapp.com",
            projectId: "quanlylop-ntb",
            storageBucket: "quanlylop-ntb.firebasestorage.app",
            messagingSenderId: "332000248751",
            appId: "1:332000248751:web:ebb85e784b5bde121e255a",
            measurementId: "G-7DZQL7ELDQ"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let studentsData = [];
        let shuffledSecretList = [];
        let spinIntervals = [];

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                db.collection("quanlylop_data").doc(currentUser.uid).get().then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        let studentsToSave = data.StudentsData || data.DuLieu_Lop11_Master;
                        if (studentsToSave) localStorage.setItem('DuLieu_Lop11_Master', studentsToSave);
                    }
                    loadStudents();
                });
            } else { loadStudents(); }
        });

        function loadStudents() {
            const rawData = localStorage.getItem('DuLieu_Lop11_Master');
            if (rawData) {
                studentsData = JSON.parse(rawData);
                renderStudentList(); initEmptyGrid();
            } else {
                document.getElementById('studentListUI').innerHTML = "<li style='color:var(--danger);'>Chưa có dữ liệu học sinh trong hệ thống.</li>";
            }
        }

        function toggleSidebar(e) {
            const sidebar = document.getElementById('sidebarPanel');
            if (sidebar.classList.contains('collapsed')) { sidebar.classList.remove('collapsed'); e.stopPropagation(); }
        }

        function syncLayoutBoxes(source) {
            const left = document.getElementById('leftBox'); const right = document.getElementById('rightBox');
            if (source === 'left') right.value = (left.value === 'door') ? 'teacher' : 'door';
            else left.value = (right.value === 'door') ? 'teacher' : 'door';
        }

        function initEmptyGrid() {
            const grid = document.getElementById('deskGrid'); let html = '';
            // Render chuẩn khớp với logic Sơ đồ lớp (Bàn 6 ở trên, Bàn 1 ở dưới cùng)
            for(let r = 0; r < 6; r++) { 
                for(let c = 0; c < 4; c++) {
                    html += `<div class="desk-item"><span class="desk-label">Bàn ${6 - r}</span><div class="seat-empty">Trống</div><div class="seat-empty">Trống</div></div>`;
                }
            }
            grid.innerHTML = html;
        }

        function renderStudentList() {
            const listUI = document.getElementById('studentListUI');
            document.getElementById('totalCount').innerText = studentsData.length + " HS";
            listUI.innerHTML = studentsData.map((s, i) => {
                let gt = (s["Giới Tính"] || "").toLowerCase();
                let color = gt.includes("nam") ? "#1d4ed8" : "#be185d";
                return `<li><span>${i + 1}. ${s["Họ và Tên"]}</span> <span style="color:${color}; font-size:12.5px;">${s["Giới Tính"]||"Khác"}</span></li>`;
            }).join('');
        }

        // ============================================
        // LOGIC HUYỀN HỌC & TÂM LINH
        // ============================================
        function getNumerology(dateStr) {
            if(!dateStr) return Math.floor(Math.random() * 9) + 2;
            let sum = dateStr.replace(/\D/g, '').split('').reduce((a,b)=>a+parseInt(b), 0);
            while(sum > 9 && sum !== 11 && sum !== 22) {
                sum = sum.toString().split('').reduce((a,b)=>a+parseInt(b), 0);
            }
            return sum; // Trả về con số chủ đạo
        }

        function getBaziGroup(dateStr) {
            if(!dateStr) return Math.floor(Math.random() * 5);
            let parts = dateStr.split('/');
            if(parts.length < 2) return Math.floor(Math.random() * 5);
            let day = parseInt(parts[0]); let month = parseInt(parts[1]);
            return (day + month) % 5; // Giả lập 5 nhóm ngũ hành Tương sinh
        }

        function startBlindBoxGame() {
            if(studentsData.length === 0) return alert("Chưa có danh sách lớp để tạo Hộp mù!");

            document.getElementById('sidebarPanel').classList.add('collapsed');
            
            let mode = document.getElementById('mixMode').value;
            let boys = []; let girls = []; let all = [];
            
            studentsData.forEach((s, index) => {
                let sObj = { ...s, orgIdx: index };
                all.push(sObj);
                let gt = (s["Giới Tính"] || "").toLowerCase();
                if(gt.includes('nam')) boys.push(sObj); else girls.push(sObj);
            });

            const shuffleArray = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } };
            
            let columns = [[], [], [], []]; 

            // CÁC CHẾ ĐỘ GHÉP CẶP
            if (mode === 'split') {
                shuffleArray(boys); shuffleArray(girls);
                let bPairs = []; let gPairs = [];
                while(boys.length >= 2) bPairs.push([boys.pop(), boys.pop()]);
                if(boys.length === 1) bPairs.push([boys.pop(), null]);
                while(girls.length >= 2) gPairs.push([girls.pop(), girls.pop()]);
                if(girls.length === 1) gPairs.push([girls.pop(), null]);
                
                shuffleArray(bPairs); shuffleArray(gPairs);
                bPairs.forEach((p, i) => columns[i % 2].push(p));
                gPairs.forEach((p, i) => columns[(i % 2) + 2].push(p));

            } else if (mode === 'numerology') {
                // Nhóm theo Thần số học
                let numGroups = {};
                all.forEach(s => {
                    let num = getNumerology(s["Ngày Sinh"]);
                    if(!numGroups[num]) numGroups[num] = [];
                    numGroups[num].push(s);
                });
                let pairs = [];
                for(let key in numGroups) {
                    let group = numGroups[key]; shuffleArray(group);
                    while(group.length >= 2) pairs.push([group.pop(), group.pop()]);
                    if(group.length === 1) all.push(group.pop()); // Đẩy phần lẻ ra xếp chung
                }
                shuffleArray(all);
                while(all.length >= 2) pairs.push([all.pop(), all.pop()]);
                if(all.length === 1) pairs.push([all.pop(), null]);
                
                shuffleArray(pairs);
                let colIdx = 0; pairs.forEach(p => { columns[colIdx % 4].push(p); colIdx++; });

            } else if (mode === 'battu') {
                // Nhóm theo Ngũ hành / Tam hợp
                let baziGroups = {};
                all.forEach(s => {
                    let bz = getBaziGroup(s["Ngày Sinh"]);
                    if(!baziGroups[bz]) baziGroups[bz] = [];
                    baziGroups[bz].push(s);
                });
                let pairs = [];
                for(let key in baziGroups) {
                    let group = baziGroups[key]; shuffleArray(group);
                    while(group.length >= 2) pairs.push([group.pop(), group.pop()]);
                    if(group.length === 1) all.push(group.pop());
                }
                shuffleArray(all);
                while(all.length >= 2) pairs.push([all.pop(), all.pop()]);
                if(all.length === 1) pairs.push([all.pop(), null]);
                
                shuffleArray(pairs);
                let colIdx = 0; pairs.forEach(p => { columns[colIdx % 4].push(p); colIdx++; });

            } else {
                let pairs = [];
                if (mode === 'random') {
                    shuffleArray(all);
                    while(all.length >= 2) pairs.push([all.pop(), all.pop()]);
                    if(all.length === 1) pairs.push([all.pop(), null]);
                } 
                else if (mode === 'mixed') {
                    shuffleArray(boys); shuffleArray(girls);
                    while(boys.length > 0 && girls.length > 0) pairs.push([boys.pop(), girls.pop()]);
                    let leftovers = [...boys, ...girls]; shuffleArray(leftovers);
                    while(leftovers.length >= 2) pairs.push([leftovers.pop(), leftovers.pop()]);
                    if(leftovers.length === 1) pairs.push([leftovers.pop(), null]);
                } 
                else { 
                    shuffleArray(boys); shuffleArray(girls);
                    while(boys.length >= 2) pairs.push([boys.pop(), boys.pop()]);
                    while(girls.length >= 2) pairs.push([girls.pop(), girls.pop()]);
                    let leftovers = [...boys, ...girls]; shuffleArray(leftovers);
                    while(leftovers.length >= 2) pairs.push([leftovers.pop(), leftovers.pop()]);
                    if(leftovers.length === 1) pairs.push([leftovers.pop(), null]);
                }

                shuffleArray(pairs);
                let colIdx = 0; pairs.forEach(p => { columns[colIdx % 4].push(p); colIdx++; });
            }

            // Đồng bộ thứ tự ưu tiên lấp bàn: Bàn 2 -> 6 trước, chừa Bàn 1
            // Chỉ số mapping chuẩn: 0=Bàn6, 1=Bàn5, 2=Bàn4, 3=Bàn3, 4=Bàn2, 5=Bàn1
            shuffledSecretList = new Array(48).fill(null);
            const prefOrder = [4, 3, 2, 1, 0, 5]; 
            
            for(let c=0; c<4; c++) {
                let col = columns[c];
                let emptyPairs = col.filter(p => p[0] === null && p[1] === null);
                let occupiedPairs = col.filter(p => p[0] !== null || p[1] !== null);
                shuffleArray(occupiedPairs);
                let sortedCol = [...occupiedPairs, ...emptyPairs];
                
                for(let i=0; i<6; i++) {
                    let r = prefOrder[i];
                    let absId = c * 6 + r;
                    let pair = sortedCol[i] || [null, null];
                    
                    if(pair && Math.random() > 0.5) pair.reverse(); 
                    
                    if(pair) {
                        shuffledSecretList[absId * 2] = pair[0];
                        shuffledSecretList[absId * 2 + 1] = pair[1];
                    }
                }
            }

            const grid = document.getElementById('deskGrid');
            let html = '';
            let htmlIndex = 0;

            // Render theo chiều dọc từ Bàn 6 -> Bàn 1 (0 -> 5)
            for(let r = 0; r < 6; r++) {
                for(let c = 0; c < 4; c++) {
                    let absId = c * 6 + r;
                    let hs1 = shuffledSecretList[absId * 2];
                    let hs2 = shuffledSecretList[absId * 2 + 1];
                    let deskLabel = `Bàn ${6 - r}`;
                    
                    let s1HTML = hs1 ? createBlindBoxHTML(htmlIndex++, hs1) : `<div class="seat-empty">Trống</div>`;
                    let s2HTML = hs2 ? createBlindBoxHTML(htmlIndex++, hs2) : `<div class="seat-empty">Trống</div>`;

                    html += `<div class="desk-item"><span class="desk-label">${deskLabel}</span>${s1HTML}${s2HTML}</div>`;
                }
            }
            grid.innerHTML = html;
            
            spinIntervals.forEach(clearInterval);
            spinIntervals = [];
        }

        function createBlindBoxHTML(index, studentObj) {
            let name = studentObj["Họ và Tên"];
            let gender = studentObj["Giới Tính"];
            return `<div class="blind-box" onclick="revealBox(this)" data-name="${name}" data-gender="${gender}"><span class="box-icon">🎁</span>Hộp số ${index + 1}</div>`;
        }

        function revealBox(element) {
            element.classList.add('shake');
            setTimeout(() => {
                let name = element.getAttribute('data-name');
                let gender = (element.getAttribute('data-gender') || "").toLowerCase();
                element.className = 'seat-revealed ' + (gender.includes('nam') ? 'seat-nam' : 'seat-nu');
                element.innerHTML = name; 
                element.removeAttribute('onclick');
            }, 400);
        }

        function revealAllWithSpin() {
            let boxes = document.querySelectorAll('.blind-box');
            if(boxes.length === 0) return;

            boxes.forEach((box, index) => {
                let finalName = box.getAttribute('data-name');
                let finalGender = (box.getAttribute('data-gender') || "").toLowerCase();
                
                box.innerHTML = `<span class="rolling-text">Đang lật quẻ...</span>`;
                box.style.background = "#fff"; box.style.borderColor = "#cbd5e1"; box.style.boxShadow = "none";
                
                let fakeNames = studentsData.map(s => s["Họ và Tên"].split(' ').pop());
                
                let interval = setInterval(() => {
                    box.innerHTML = `<span class="rolling-text" style="color:var(--info-dark); font-size:13.5px;">${fakeNames[Math.floor(Math.random() * fakeNames.length)]}</span>`;
                }, 80);
                spinIntervals.push(interval);

                setTimeout(() => {
                    clearInterval(interval);
                    box.className = 'seat-revealed ' + (finalGender.includes('nam') ? 'seat-nam' : 'seat-nu');
                    box.innerHTML = finalName; 
                    box.removeAttribute('onclick');
                }, 1500 + (index * 200)); 
            });
        }

        function revealAllQuick() {
            let boxes = document.querySelectorAll('.blind-box');
            boxes.forEach((box, index) => { setTimeout(() => { revealBox(box); }, index * 30); });
        }

        function syncLayoutToMain() {
            if(shuffledSecretList.length === 0) return alert("Bạn chưa khởi tạo Hộp mù. Vui lòng bấm TRỘN LỚP trước khi lưu!");

            let boxes = document.querySelectorAll('.blind-box');
            if(boxes.length > 0) {
                let force = confirm("Còn một số hộp chưa được mở! Chốt sơ đồ và Lưu hệ thống ngay bây giờ?");
                if(!force) return;
            }

            const seatingArray = new Array(48).fill("");
            for(let i=0; i<48; i++) {
                if(shuffledSecretList[i]) seatingArray[i] = shuffledSecretList[i].orgIdx.toString();
            }

            localStorage.setItem('Seating_Lop11', JSON.stringify(seatingArray));
            localStorage.removeItem('DutySchedule_Lop11');
            localStorage.removeItem('DutyPairIndex_Lop11');
            localStorage.removeItem('DutyCurrentStartIndex_Lop11');

            if(currentUser) {
                db.collection("quanlylop_data").doc(currentUser.uid).set({
                    Seating_Lop11: JSON.stringify(seatingArray),
                    DutySchedule_Lop11: firebase.firestore.FieldValue.delete(),
                    DutyPairIndex_Lop11: firebase.firestore.FieldValue.delete(),
                    DutyCurrentStartIndex_Lop11: firebase.firestore.FieldValue.delete(),
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).then(() => {
                    alert("✅ Lưu thành công! Sơ đồ hiện tại đã được đồng bộ làm sơ đồ chính thức của Lớp.");
                });
            } else {
                alert("✅ Lưu thành công (Local)! Sơ đồ hiện tại đã được đồng bộ làm sơ đồ chính thức của Lớp.");
            }
        }
    </script>
</body>
